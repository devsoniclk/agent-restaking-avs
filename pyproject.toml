[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-restaking-avs"
version = "0.1.1"
description = "Autonomous AI agent Actively Validated Service (AVS) restaking, dual-quorum economic security (ETH/native tokens), cryptographic W3C DID identity attestation, cross-chain state relays, and deterministic SLA dispute arbitration with automated collateral slashing waterfalls."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Lakshitha Dananjaya", email = "dananjayarox01@gmail.com" }
]
keywords = [
    "ai-agents",
    "autonomous-agents",
    "avs",
    "restaking",
    "eigenlayer",
    "symbiotic",
    "economic-security",
    "slashing",
    "dispute-arbitration",
    "mcp",
    "web3"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
agent-restaking-avs = "agent_restaking_avs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_restaking_avs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
